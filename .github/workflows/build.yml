name: build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The Dockerfile installs the Playwright browser above the source COPY, so
      # a code-only change reuses that layer: ~2.5 min cold, seconds warm.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: metal-tour-check:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building only proves the image compiles. These prove it runs — which is
      # the part that would actually break.
      - name: Run tests inside the image
        run: docker run --rm metal-tour-check:ci sh -c "python test_bands.py && python test_cities.py"

      - name: Check the bundled Firefox launches
        run: >
          docker run --rm metal-tour-check:ci python -c
          "from playwright.sync_api import sync_playwright;
          p = sync_playwright().start();
          b = p.firefox.launch(headless=True);
          b.close(); p.stop();
          print('firefox ok')"
